<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用统计 ·《智能软件工程基础》幻灯片</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* ============ 主题变量（数据可视化配色，亮/暗双模式） ============ */
    :root {
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11, 11, 11, 0.10);
      --series-1: #2a78d6;   /* 蓝：会话数/停留 */
      --series-2: #eb6834;   /* 橙：时长 */
      --series-3: #1baf7a;   /* 绿青：跳转 */
      --good: #0ca30c;
      --critical: #d03b3b;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #0d0d0d; --surface: #1a1a19;
        --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
        --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
        --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb 60%, #0ea5e9);
      color: #fff;
      padding: 26px 28px 22px;
    }
    header h1 { font-size: 24px; letter-spacing: 1px; }
    header p { margin-top: 6px; opacity: .85; font-size: 13px; }
    #status-bar {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      font-size: 13px;
    }
    #conn { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    #conn .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    #conn.online .dot { background: var(--good); }
    #conn.offline .dot { background: var(--critical); }
    #conn.disabled .dot { background: #898781; }
    #status-bar input {
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      color: #fff;
      padding: 5px 10px;
      font-size: 13px;
      width: 260px;
      outline: none;
    }
    #status-bar input:focus { border-color: #fff; }
    #status-bar button, #status-bar a {
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      color: #fff;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.5;
    }
    #status-bar button:hover, #status-bar a:hover { background: rgba(255,255,255,.28); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

    section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 22px; }
    h2 { font-size: 17px; color: var(--ink); margin-bottom: 14px; font-weight: 700; }
    h2 .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
    code { background: var(--page); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-family: Consolas, monospace; font-size: 12px; }

    /* 总览卡 */
    #overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    #overview section { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--page); }
    #overview .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #overview .lbl { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    #overview .num small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 2px; }

    /* 小节明细表 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--page); }
    .slug { color: var(--muted); font-size: 12px; font-family: Consolas, monospace; }
    .mode { font-size: 11px; color: var(--muted); border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

    /* 柱状图：水平（停留/功能） */
    .bars-h { display: flex; flex-direction: column; gap: 8px; }
    .row { display: grid; grid-template-columns: 130px 1fr 56px; gap: 10px; align-items: center; font-size: 13px; }
    .row .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track { height: 14px; background: var(--page); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
    .bar.s1 { background: var(--series-1); }
    .bar.s2 { background: var(--series-2); }
    .row .val { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

    /* 柱状图：纵向（按日/按小时） */
    .bars-v { display: flex; align-items: stretch; gap: 3px; height: 150px; padding-top: 6px; border-bottom: 1px solid var(--axis); }
    .vcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .vwrap { flex: 1; display: flex; align-items: flex-end; }
    .vbar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; transition: opacity .15s; }
    .vbar:hover { opacity: .75; }
    .vbar.s1 { background: var(--series-1); }
    .vbar.s2 { background: var(--series-2); }
    .vlabel { font-size: 10px; color: var(--muted); text-align: center; padding-top: 4px; white-space: nowrap; }
    .chart-title { font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .stack { display: flex; height: 20px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .stack i { display: block; height: 100%; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .k { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .empty, .error { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
    .error .big { font-size: 40px; margin-bottom: 12px; }
    .error button { margin-top: 14px; background: var(--series-1); color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
    #load-msg { display: none; }
    .muted { color: var(--muted); }
    .back { display: inline-block; margin: 18px 0 0 20px; color: var(--series-1); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>《智能软件工程基础》使用统计</h1>
    <p>数据来自统计服务（客户端采集 → stats-data/events.jsonl → 本页实时聚合）</p>
    <div id="status-bar">
      <span id="conn" class="online"><span class="dot"></span><span id="conn-text">连接中…</span></span>
      <span>服务：<input id="endpoint" placeholder="http://localhost:3939" spellcheck="false"></span>
      <button id="btn-save">保存地址</button>
      <button id="btn-refresh">刷新</button>
      <a id="btn-export" download="stats.json">导出 JSON</a>
      <a id="btn-raw" target="_blank" rel="noopener">原始事件</a>
      <button id="btn-theme">暗色</button>
    </div>
  </header>

  <div class="wrap">
    <a class="back" href="index.html">◀ 返回小节菜单</a>

    <div id="load-msg" class="error">
      <div class="big">📡</div>
      <div>无法连接统计服务</div>
      <div class="muted" style="font-size:13px;margin-top:8px">请确认已运行 <code>node docs/tools/stats-server.js</code>，且上方的服务地址正确（浏览器需能访问该地址）。</div>
      <button id="btn-retry">重试</button>
    </div>

    <div id="main">
      <section id="overview"><h2>总览</h2></section>
      <section id="units"><h2>每小节明细<span class="hint">按 slug 排序</span></h2></section>
      <section id="daily">
        <h2>按日趋势<span class="hint">使用访问者本地日期</span></h2>
        <div id="daily-sessions"></div>
        <div id="daily-duration" style="margin-top:20px"></div>
      </section>
      <section id="hourly"><h2>按小时打开分布<span class="hint">会话开始所在时段，使用访问者本地时间</span></h2><div id="hourly-chart"></div></section>
      <section id="habit"><h2>浏览习惯</h2><div id="habit-body"></div></section>
    </div>
  </div>

  <script>window.SLIDE_STATS_NO_AUTO = true;</script>
  <script src="js/stats.js"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      /* ---------- 工具 ---------- */
      function esc(x) {
        return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fmtDur(sec) {
        sec = Math.round(sec || 0);
        if (sec < 60) return sec + " 秒";
        if (sec < 3600) { var m = Math.floor(sec / 60); return m + " 分" + (sec % 60 ? " " + (sec % 60) + " 秒" : ""); }
        var h = Math.floor(sec / 3600); var mm = Math.floor((sec % 3600) / 60);
        return h + " 小时" + (mm ? " " + mm + " 分" : "");
      }
      function fmtNum(n) { return String(n == null ? 0 : n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
      function fmtDay(day) { return day && day.length >= 10 ? day.slice(5) : (day || ""); }
      function maxVal(arr, get) { return arr.reduce(function (m, x) { return Math.max(m, get(x)); }, 0); }

      /* ---------- 主题 ---------- */
      function initTheme() {
        var t = "light";
        try { t = localStorage.getItem("slides-theme") || "light"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        $("btn-theme").textContent = t === "dark" ? "亮色" : "暗色";
      }
      function toggleTheme() {
        var html = document.documentElement;
        var dark = html.getAttribute("data-theme") === "dark";
        html.setAttribute("data-theme", dark ? "light" : "dark");
        try { localStorage.setItem("slides-theme", dark ? "light" : "dark"); } catch (e) {}
        $("btn-theme").textContent = dark ? "暗色" : "亮色";
      }

      /* ---------- 图表：纵向柱（单色，归一化到最大值） ---------- */
      function vchart(values, colorClass, labelStep, maxBarHeightPct) {
        var n = values.length;
        var max = maxVal(values, function (v) { return v.val; });
        var html = '<div class="bars-v">';
        for (var i = 0; i < n; i++) {
          var v = values[i];
          var h = max > 0 ? Math.max(2, Math.round(v.val / max * 100)) : 0;
          if (maxBarHeightPct) h = Math.min(h, maxBarHeightPct);
          var label = (i % labelStep === 0) ? fmtDay(v.label) : "";
          html += '<div class="vcol">' +
            '<div class="vwrap"><div class="vbar ' + colorClass + '" style="height:' + h + '%" title="' +
            esc(v.label) + (v.sub || "") + "：" + fmtNum(v.val) + (v.unit || "") + '"></div></div>' +
            '<div class="vlabel">' + esc(label) + '</div></div>';
        }
        html += '</div>';
        return html;
      }

      /* ---------- 图表：水平条（单色） ---------- */
      function hchart(rows, colorClass, maxPct) {
        var max = maxVal(rows, function (r) { return r.val; });
        var html = '<div class="bars-h">';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var pct = max > 0 ? Math.round(r.val / max * 100) : 0;
          if (maxPct) pct = Math.min(pct, maxPct);
          html += '<div class="row"><div class="lbl" title="' + esc(r.lbl) + '">' + esc(r.lbl) + '</div>' +
            '<div class="track"><div class="bar ' + colorClass + '" style="width:' + pct + '%" title="' + esc(r.lbl) + "：" + fmtNum(r.val) + (r.unit || "") + '"></div></div>' +
            '<div class="val">' + fmtNum(r.val) + (r.unit || "") + '</div></div>';
        }
        html += '</div>';
        return html;
      }

      /* ---------- 渲染 ---------- */
      function render(data) {
        window.__lastData = data;   // 供「导出 JSON」使用
        var c = data.counts || {};
        var totalDur = c.durationSec || 0;

        // 总览卡
        var overview = [
          { n: fmtNum(c.home), l: "首页打开" },
          { n: fmtNum(c.player), l: "播放器打开" },
          { n: fmtNum(c.sessions), l: "会话" },
          { n: fmtNum(c.fiveMin), l: "≥5 分钟播放" },
          { n: fmtNum(c.completed), l: "完播" },
          { n: fmtNum(c.reachedEnd), l: "到达末页" },
          { n: fmtDur(totalDur), l: "累计浏览时长", big: totalDur > 0 },
          { n: fmtDur(c.sessions ? Math.round(totalDur / c.sessions) : 0), l: "人均时长", big: c.sessions > 0 },
          { n: fmtNum(c.clients), l: "独立访客" },
        ];
        $("overview").innerHTML = '<h2>总览<span class="hint">生成于 ' + new Date(data.generatedAt).toLocaleString() + "</span></h2>" +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">' +
          overview.map(function (o) {
            return '<section><div class="num">' + o.n + "</div><div class=\"lbl\">" + o.l + "</div></section>";
          }).join("") + "</div>";

        // 小节明细表
        var units = data.units || [];
        var rows = units.map(function (u) {
          var tts = u.tts || {}, fe = u.features || {}, nav = u.nav || {};
          var top = (u.top || []).map(function (p) { return "第" + (p[0] + 1) + "页 " + Math.round(p[1]) + "s"; }).join(" · ");
          return "<tr>" +
            "<td><div>" + esc(u.title || u.slug) + "<span class=\"mode\">" + esc(u.mode || "") + "</span></div>" +
            "<div class=\"slug\">" + esc(u.slug) + "</div></td>" +
            '<td class="num">' + fmtNum(u.sessions) + "</td>" +
            '<td class="num">' + (u.sessions ? fmtDur(Math.round(u.totalSec / u.sessions)) : "—") + "</td>" +
            '<td class="num">' + fmtNum(u.fiveMin) + "</td>" +
            '<td class="num">' + fmtNum(u.completed) + "</td>" +
            '<td class="num">' + (nav.next || 0) + " / " + (nav.prev || 0) + " / " + (nav.jump || 0) + "</td>" +
            '<td class="num">' + (tts.plays || 0) + " 次 · " + fmtDur(tts.sec || 0) + "</td>" +
            '<td class="num">' + (fe.fullscreen || 0) + "·" + (fe.overview || 0) + "·" + (fe.theme || 0) + "·" + (fe.zoom || 0) + "·" + (fe.recording || 0) + "</td>" +
            '<td class="muted" style="font-size:12px">' + esc(top) + "</td>" +
            "</tr>";
        }).join("");
        $("units").innerHTML = '<h2>每小节明细<span class="hint">翻页 next/prev/jump · 功能 全屏/总览/主题/缩放/录屏</span></h2>' +
          (units.length ? '<table><thead><tr>' +
            "<th>小节</th><th class=\"num\">会话</th><th class=\"num\">平均时长</th><th class=\"num\">≥5分钟</th><th class=\"num\">完播</th>" +
            '<th class="num">翻页 N/P/J</th><th class="num">TTS</th><th class="num">功能 全/览/主/缩/录</th><th>停留 TOP</th>' +
            "</tr></thead><tbody>" + rows + "</tbody></table>"
            : '<div class="muted">暂无小节数据</div>');

        // 按日趋势（两个独立单色柱图，避免双轴）
        var daily = data.daily || [];
        var sessChart = vchart(daily.map(function (d) { return { label: d.day, val: d.sessions, sub: " 会话", unit: "" }; }), "s1", Math.ceil(Math.max(1, daily.length / 10)));
        var durChart = vchart(daily.map(function (d) { return { label: d.day, val: Math.round(d.sec / 60), sub: " 时长", unit: " 分钟" }; }), "s2", Math.ceil(Math.max(1, daily.length / 10)));
        $("daily-sessions").innerHTML = '<div class="chart-title">每日会话数</div>' + (daily.length ? sessChart : '<div class="muted">暂无数据</div>');
        $("daily-duration").innerHTML = '<div class="chart-title">每日浏览时长（分钟）</div>' + (daily.length ? durChart : '<div class="muted">暂无数据</div>');

        // 按小时分布
        var hourly = data.hourly || [];
        $("hourly-chart").innerHTML = hourly.length
          ? vchart(hourly.map(function (h) { return { label: String(h.hour) + ":00", val: h.sessions }; }), "s1", 3)
          : '<div class="muted">暂无数据</div>';

        // 浏览习惯
        var navT = 0, navN = 0, navP = 0, navJ = 0;
        units.forEach(function (u) {
          navN += (u.nav && u.nav.next) || 0; navP += (u.nav && u.nav.prev) || 0; navJ += (u.nav && u.nav.jump) || 0;
        });
        navT = navN + navP + navJ;
        var pct = function (v) { return navT ? Math.round(v / navT * 100) : 0; };
        var feats = { 全屏: 0, 网格总览: 0, 主题切换: 0, 字号缩放: 0, 录屏: 0 };
        var ttsPlays = 0, ttsSec = 0;
        units.forEach(function (u) {
          var f = u.features || {}, t = u.tts || {};
          feats["全屏"] += f.fullscreen || 0; feats["网格总览"] += f.overview || 0;
          feats["主题切换"] += f.theme || 0; feats["字号缩放"] += f.zoom || 0; feats["录屏"] += f.recording || 0;
          ttsPlays += t.plays || 0; ttsSec += t.sec || 0;
        });
        var habitHtml = "";
        // 导航比例（堆叠条 + 图例）
        habitHtml += '<div class="chart-title">翻页方式：' + fmtNum(navT) + " 次（next " + pct(navN) + "% · prev " + pct(navP) + "% · jump " + pct(navJ) + "%）</div>";
        habitHtml += '<div class="stack">' +
          '<i class="s1" style="width:' + (navT ? pct(navN) : 1) + '%"></i>' +
          '<i class="s2" style="width:' + (navT ? pct(navP) : 1) + '%"></i>' +
          '<i class="s3" style="width:' + (navT ? pct(navJ) : 1) + '%"></i></div>';
        habitHtml += '<div class="legend">' +
          '<span><i style="background:var(--series-1)"></i>下一页 ' + fmtNum(navN) + "</span>" +
          '<span><i style="background:var(--series-2)"></i>上一页 ' + fmtNum(navP) + "</span>" +
          '<span><i style="background:var(--series-3)"></i>跳转 ' + fmtNum(navJ) + "</span></div>";
        // 功能使用
        var featRows = Object.keys(feats).map(function (k) { return { lbl: k, val: feats[k], unit: "" }; });
        habitHtml += '<div style="margin-top:22px" class="chart-title">功能使用（累计次数）</div>' + hchart(featRows, "s1");
        // TTS 汇总
        habitHtml += '<div style="margin-top:22px" class="stat-grid">' +
          '<div class="stat"><div class="v">' + fmtNum(ttsPlays) + "</div><div class=\"k\">朗读次数</div></div>" +
          '<div class="stat"><div class="v">' + fmtDur(ttsSec) + "</div><div class=\"k\">朗读总时长</div></div>" +
          '<div class="stat"><div class="v">' + (c.sessions ? Math.round(ttsPlays / c.sessions * 100) : 0) + "%</div><div class=\"k\">会话朗读占比</div></div>" +
          "</div>";
        // 全局停留 TOP
        var dwellTop = data.dwellTop || [];
        if (dwellTop.length) {
          var topRows = dwellTop.map(function (d) {
            var unit = units.find(function (u) { return u.slug === d.slug; });
            return { lbl: (unit && unit.title || d.slug) + " · 第" + (d.i + 1) + "页", val: d.sec, unit: " 秒" };
          });
          habitHtml += '<div style="margin-top:22px" class="chart-title">停留最久的页 TOP10</div>' + hchart(topRows, "s2");
        }
        $("habit-body").innerHTML = habitHtml;
      }

      /* ---------- 数据加载 ---------- */
      function setConn(state, text) {
        var el = $("conn");
        el.className = state;
        $("conn-text").textContent = text;
      }
      function load() {
        var ep = window.SlideStats.getEndpoint();
        $("endpoint").value = ep;
        $("btn-raw").href = ep.replace(/\/+$/, "") + "/api/raw";
        if (!window.SlideStats.isEnabled()) {
          setConn("disabled", "统计已禁用（端点为 off / 空）");
          $("load-msg").style.display = "none";
          $("main").style.display = "block";
          $("main").innerHTML = '<section><h2>统计已禁用</h2><div class="muted">请在上方填写有效的服务地址并保存（如 <code>http://localhost:3939</code>），或去掉 <code>off</code> 配置。</div></section>';
          return;
        }
        setConn("online", "连接中…");
        window.SlideStats.fetchStats(ep.replace(/\/+$/, "") + "/api/stats").then(function (data) {
          if (!data) {
            setConn("offline", "无法连接统计服务");
            $("load-msg").style.display = "block";
            $("main").style.display = "none";
            return;
          }
          setConn("online", "已连接 · " + ep);
          $("load-msg").style.display = "none";
          $("main").style.display = "block";
          render(data);
        });
      }

      /* ---------- 事件 ---------- */
      $("btn-refresh").addEventListener("click", load);
      $("btn-retry").addEventListener("click", load);
      $("btn-theme").addEventListener("click", toggleTheme);
      $("btn-save").addEventListener("click", function () {
        window.SlideStats.setEndpoint($("endpoint").value.trim());
        load();
      });
      $("btn-export").addEventListener("click", function (e) {
        if (!window.__lastData) { alert("暂无数据可导出"); e.preventDefault(); return; }
        var blob = new Blob([JSON.stringify(window.__lastData, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "slides-stats-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        e.preventDefault();
      });

      initTheme();
      load();
    })();
  </script>
</body>
</html>
